<!DOCTYPE html>
<html lang="en" data-sh-auto="1" data-sh-title="Currency" data-sh-root="../..">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Currency · Shophelper</title>
<link rel="stylesheet" href="../../shell.css?v=11">
<link rel="stylesheet" href="../../tools-bridge.css?v=11">
<script src="../../js/theme.js"></script>
</head>
<body>
<main class="sh-page">
  <section class="sh-card">
    <label class="sh-label" for="amount">Amount</label>
    <input id="amount" class="sh-amount" inputmode="decimal" autocomplete="off" data-sh-kind="money" data-sh-currency-select="from">
    <div class="sh-row">
      <div>
        <label class="sh-label" for="from">From</label>
        <select id="from"></select>
      </div>
      <button class="sh-btn" id="swap" type="button" style="flex:0 0 44px; align-self:end" aria-label="Swap currencies">↔</button>
      <div>
        <label class="sh-label" for="to">To</label>
        <select id="to"></select>
      </div>
    </div>
    <p class="sh-k">Converted</p>
    <p class="sh-result" id="result">—</p>
    <p class="sh-note" id="rateLine"></p>
    <p class="sh-estimate" id="mental"></p>
    <div class="sh-actions">
      <button class="sh-btn" id="refresh" type="button">Refresh rate</button>
    </div>
    <label class="sh-label" for="manual">Manual rate (1 from = this many to)</label>
    <div class="sh-row">
      <input id="manual" inputmode="decimal" placeholder="Optional, for a cash desk rate">
      <button class="sh-btn" id="saveManual" type="button" style="flex:0 0 auto">Use manual</button>
      <button class="sh-btn" id="clearManual" type="button" style="flex:0 0 auto">Use fetched</button>
    </div>
  </section>
  <section class="sh-card">
    <h2>Scribble</h2>
    <label class="sh-label" for="scratchCurrency">Scribble currency</label>
    <select id="scratchCurrency"></select>
    <label class="sh-label" for="scratch">Notes</label>
    <textarea id="scratch" placeholder="sweater 32 x 5&#10;30 per bottle / 5&#10;# remember the blue one"></textarea>
    <p class="sh-note">A line that is only a number is added. <span class="sh-v">32 x 5</span> and <span class="sh-v">30 per bottle / 5</span> are added. Words alone, and lines starting with #, stay notes.</p>
    <div class="sh-lines" id="lines"></div>
    <p class="sh-k">Scribble total</p>
    <p class="sh-result" id="scratchTotal">—</p>
    <button class="sh-btn warn" id="clearScratch" type="button">Clear scribble</button>
  </section>
</main>
<script src="../../js/decimal.js"></script>
<script src="../../js/units.js"></script>
<script src="../../js/napkin.js"></script>
<script src="../../js/mental.js"></script>
<script src="../../js/tax.js"></script>
<script src="../../js/prices.js"></script>
<script src="../../js/results.js"></script>
<script src="../../js/rates.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/shell.js?v=11"></script>
<script src="page.js"></script>
</body>
</html>
