<!DOCTYPE html>
<html lang="en" data-sh-auto="1" data-sh-title="Shopping List" data-sh-root="../..">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping List · Shophelper</title>
<link rel="stylesheet" href="../../shell.css?v=12">
<link rel="stylesheet" href="../../tools-bridge.css?v=12">
<script src="../../js/theme.js"></script>
<style>
  .list-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .list-row {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--sh-line); border-radius: 12px;
    background: var(--sh-bg); padding: 4px 6px; min-height: 48px;
  }
  .list-row.is-dragging { opacity: .45; }
  .list-row.drop-before { box-shadow: 0 -3px 0 0 var(--sh-accent); }
  .list-row.drop-after { box-shadow: 0 3px 0 0 var(--sh-accent); }
  .list-handle { cursor: grab; color: var(--sh-muted); user-select: none; padding: 0 4px; touch-action: none; }
  .list-row input[type="checkbox"] { width: 22px; height: 22px; flex: 0 0 auto; }
  .list-text { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .list-title { overflow-wrap: anywhere; font-weight: 650; }
  .list-qty { color: var(--sh-muted); font-size: .9rem; }
  .list-row.is-checked .list-title { text-decoration: line-through; opacity: .7; }
  .list-icon-btn {
    flex: 0 0 auto; min-width: 36px; min-height: 40px; padding: 0 6px;
    border: 1px solid transparent; border-radius: 10px; background: transparent; font-size: 1rem;
  }
  .list-icon-btn[aria-pressed="true"] { color: var(--sh-accent); font-weight: 800; }
  .list-icon-btn:disabled { opacity: .3; }
  #finishTrip { margin-top: 10px; }
  .staple-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .staple-chip {
    min-height: 40px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--sh-line); background: var(--sh-bg); font-weight: 650;
  }
  #shareDialog, #importDialog {
    width: min(560px, calc(100% - 24px)); max-height: 86vh; overflow: auto;
    background: var(--sh-card); color: var(--sh-ink);
    border: 1px solid var(--sh-line); border-radius: 18px; padding: 14px;
  }
  #shareDialog::backdrop, #importDialog::backdrop { background: rgba(0, 0, 0, .55); }
  #shareDialog h3, #importDialog h3 { margin: 0 0 8px; }
</style>
</head>
<body>
<main class="sh-page">
  <form id="addForm" class="sh-card">
    <label class="sh-label" for="title" data-i18n="listItem">Item</label>
    <input id="title" type="text" list="stapleHints" autocomplete="off" required>
    <datalist id="stapleHints"></datalist>
    <label class="sh-label" for="qty" data-i18n="listQty">Qty</label>
    <input id="qty" type="text" placeholder="1">
    <label class="sh-check"><input type="checkbox" id="asStaple"> <span data-i18n="listAsStaple">Recurring staple</span></label>
    <button class="sh-btn primary" type="submit" data-i18n="listAdd">Add</button>
  </form>

  <section class="sh-card">
    <h2 data-i18n="listToBuy">To buy</h2>
    <ul id="toBuy" class="list-rows"></ul>
  </section>

  <section class="sh-card">
    <h2 data-i18n="listChecked">Checked</h2>
    <ul id="checked" class="list-rows"></ul>
    <button class="sh-btn" id="finishTrip" type="button" data-i18n="listFinishTrip">Finish trip / clear checked</button>
  </section>

  <section class="sh-card">
    <h2 data-i18n="listStaples">Staples</h2>
    <div id="staples" class="staple-chips"></div>
  </section>

  <div class="sh-actions">
    <button class="sh-btn" id="shareBtn" type="button" data-i18n="listShare">Share</button>
    <button class="sh-btn" id="importBtn" type="button" data-i18n="listImport">Import</button>
  </div>

  <dialog id="shareDialog"></dialog>
  <dialog id="importDialog"></dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="../../js/decimal.js"></script>
<script src="../../js/units.js"></script>
<script src="../../js/napkin.js"></script>
<script src="../../js/mental.js"></script>
<script src="../../js/tax.js"></script>
<script src="../../js/prices.js"></script>
<script src="../../js/results.js"></script>
<script src="../../js/rates.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/list-store.js"></script>
<script src="../../js/list-codec.js"></script>
<script src="../../js/shell.js?v=12"></script>
<script src="page.js"></script>
</body>
</html>
